openapi: 3.1.0
info:
  title: Life Organizer Data Models
  description: |
    Data models and schemas for iOS app integration.

    This file contains all public data models/schemas for the Life Organizer API.
    Follow these models exactly when implementing API communication in Swift.

    This file serves as the single source of truth for data models and is
    referenced by openapi.yaml for the complete API specification.
  version: 0.1.0

components:
  schemas:
    # =============================================================================
    # ENUMS
    # =============================================================================

    ActionType:
      type: string
      enum:
        - backend_handled      # Action was completed by backend
        - app_action_required  # iOS app needs to perform an action
      description: |
        Determines what the iOS app should do with the response:
        - backend_handled: Just show the success message
        - app_action_required: Parse app_action and execute it (create reminder, add to list, etc.)

    Category:
      type: string
      enum:
        - budget    # Financial transactions
        - shopping  # Shopping list items
        - reminder  # Time-based reminders
        - calendar  # Calendar events
        - note      # Note-taking
        - quote     # Quote/snippet storage
        - unknown   # Could not classify
      description: Input classification category

    ExpenseCategory:
      type: string
      enum:
        - Baby
        - Body care
        - Clothes
        - Eat out
        - Fun
        - Groceries
        - Hobbies
        - Home improvements
        - Maya
        - Medical
        - Mortgage
        - Other
        - Subscriptions
        - Transport
        - Utilities
        - Vacation
      description: Expense categories for budget tracking (16 total)

    IncomeCategory:
      type: string
      enum:
        - Salary Ivo
        - Salary Kalina
        - Rent
        - Refunds
        - Other
      description: Income categories for budget tracking (5 total)

    SavingsCategory:
      type: string
      enum:
        - Avi Savings
        - Metlife
        - Savings
      description: Savings categories for budget tracking (3 total)

    TransactionType:
      type: string
      enum:
        - Expenses
        - Income
        - Savings
      description: Type of budget transaction

    # =============================================================================
    # REQUEST MODELS
    # =============================================================================

    ClassifyRequest:
      type: object
      required:
        - input
      properties:
        input:
          type: string
          minLength: 1
          maxLength: 1000
          description: Text input to classify (voice transcription or typed text)
          example: "spent 120eur at next"
        category:
          $ref: '#/components/schemas/Category'
          nullable: true
          description: Pre-classified category from front-end (optional, defaults to note if not provided)
      description: Primary request model for processing user input

    # =============================================================================
    # RESPONSE MODELS
    # =============================================================================

    ProcessingResponse:
      type: object
      required:
        - success
        - action_type
        - message
      properties:
        success:
          type: boolean
          description: Whether the action was successful
        action_type:
          $ref: '#/components/schemas/ActionType'
        message:
          type: string
          description: Human-readable message to display to user
          example: "Logged expenses: 234.6 BGN in Clothes"
        app_action:
          nullable: true
          description: |
            Only present when action_type == "app_action_required"
            Check the 'type' field to determine which action to perform
          oneOf:
            - $ref: '#/components/schemas/LogBudgetEntryAction'
            - $ref: '#/components/schemas/CreateReminderAction'
          discriminator:
            propertyName: type
            mapping:
              log_budget_entry: '#/components/schemas/LogBudgetEntryAction'
              create_reminder: '#/components/schemas/CreateReminderAction'
      description: |
        Main response model returned from /api/v1/process endpoint.
        Check action_type to determine how to handle the response.

    # =============================================================================
    # APP ACTION MODELS (Discriminated Union)
    # =============================================================================
    # All app actions have a 'type' field that determines which action it is.
    # Parse the type field first, then decode the rest of the fields accordingly.

    LogBudgetEntryAction:
      type: object
      required:
        - type
        - amount
        - date
        - transaction_type
        - category
      properties:
        type:
          type: string
          enum: [log_budget_entry]
          description: Action type discriminator
        amount:
          type: number
          format: float
          exclusiveMinimum: 0.0
          description: Amount in BGN (after EUR conversion)
          example: 234.6
        date:
          type: string
          format: date
          description: Transaction date (YYYY-MM-DD)
          example: "2025-11-03"
        transaction_type:
          $ref: '#/components/schemas/TransactionType'
        category:
          type: string
          description: |
            Budget category name.
            Must match one of:
            - ExpenseCategory values if transaction_type == "Expenses"
            - IncomeCategory values if transaction_type == "Income"
            - SavingsCategory values if transaction_type == "Savings"
          example: "Clothes"
        details:
          type: string
          nullable: true
          description: Merchant name or description
          example: "next"
      description: |
        Log a budget entry (expense/income/savings) to Excel tracking sheet.
        All amounts are in BGN (Bulgarian Lev) after EUR conversion.

    CreateReminderAction:
      type: object
      required:
        - type
        - title
      properties:
        type:
          type: string
          enum: [create_reminder]
          description: Action type discriminator
        title:
          type: string
          minLength: 1
          description: Reminder title/description (the action to remember)
          example: "call mom"
        due_date:
          type: string
          format: date-time
          nullable: true
          description: When the reminder is due (ISO 8601 format). Null if no time specified.
          example: "2025-11-05T17:00:00"
        list_id:
          type: string
          nullable: true
          description: Target reminders list ID (null uses default list)
          example: null
        notes:
          type: string
          nullable: true
          description: Additional context or notes
          example: "about the project meeting"
      description: |
        Create a reminder in iOS Reminders app.
        The iOS app receives this action and creates the reminder locally.

  # =============================================================================
  # EXAMPLE API RESPONSES
  # =============================================================================
  # These examples show how the schemas are used in practice

  examples:
    budget_entry:
      summary: User reports an expense
      description: User reports an expense
      value:
        request:
          input: "spent 120eur at next"
        response:
          success: true
          action_type: "app_action_required"
          message: "Logged expenses: 234.6 BGN in Clothes"
          app_action:
            type: "log_budget_entry"
            amount: 234.6
            date: "2025-11-03"
            transaction_type: "Expenses"
            category: "Clothes"
            details: "next"

    backend_handled:
      summary: Backend completed the action (future feature)
      description: Backend completed the action (future feature)
      value:
        request:
          input: "what's my budget for this month"
        response:
          success: true
          action_type: "backend_handled"
          message: "Your total expenses this month are 1234.56 BGN"
          app_action: null

    reminder_with_time:
      summary: User creates a reminder with due date
      description: User creates a reminder with a specific time
      value:
        request:
          input: "remind me to call mom tomorrow at 5pm"
          category: "reminder"
        response:
          success: true
          action_type: "app_action_required"
          message: "Reminder ready to create: 'call mom' due Nov 05 at 05:00 PM"
          app_action:
            type: "create_reminder"
            title: "call mom"
            due_date: "2025-11-05T17:00:00"
            list_id: null
            notes: null

    reminder_no_time:
      summary: User creates a reminder without time
      description: User creates a reminder without a specific due date
      value:
        request:
          input: "don't forget to buy groceries"
          category: "reminder"
        response:
          success: true
          action_type: "app_action_required"
          message: "Reminder ready to create: 'buy groceries'"
          app_action:
            type: "create_reminder"
            title: "buy groceries"
            due_date: null
            list_id: null
            notes: null

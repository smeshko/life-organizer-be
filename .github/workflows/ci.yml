# CI for pull requests into staging and pushes to it.
#   gate   runs scripts/gate.sh (ruff, mypy, unit tests) on the committed uv.lock; it is staging's required check.
#   docker builds the image only, never runs it: its CMD runs `alembic upgrade head`, which needs a database.
#   release on pushes to staging, tags and releases the next version computed by scripts/version.sh.
# No secrets are used, so integration tests (they need ANTHROPIC_API_KEY) stay out.
name: CI

on:
  pull_request:
    branches: [staging]
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: scripts/gate.sh

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build .

  release:
    name: release
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: next
        id: next
        run: |
          echo "release=false" >> "$GITHUB_OUTPUT"
          head=$(git ls-remote origin refs/heads/staging | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::staging moved on to $head; that push's run releases these commits"
            exit 0
          fi
          code=0
          next=$(scripts/version.sh 2>"$RUNNER_TEMP/hint.txt") || code=$?
          if [ "$code" = 3 ]; then
            echo "::notice::$(cat "$RUNNER_TEMP/hint.txt")"
            exit 0
          elif [ "$code" != 0 ]; then
            cat "$RUNNER_TEMP/hint.txt" >&2
            exit "$code"
          fi
          if [ "$next" = "$(scripts/version.sh --current)" ]; then
            echo "::notice::no feat, fix, perf, refactor or breaking commit since the last tag; nothing to release"
            exit 0
          fi
          scripts/version.sh --notes > "$RUNNER_TEMP/notes.md"
          {
            echo "release=true"
            echo "version=$next"
          } >> "$GITHUB_OUTPUT"
      - name: release
        if: steps.next.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/version.sh --write
          git add pyproject.toml uv.lock openapi.yaml
          git commit -m "chore(release): v$VERSION"
          git tag "v$VERSION"
          # One atomic push, so staging never carries a bump commit without its tag.
          git push --atomic origin HEAD:staging "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"

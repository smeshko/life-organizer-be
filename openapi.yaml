openapi: 3.1.0
info:
  title: Life Organizer Backend API
  description: |
    Voice-first intelligent agent for life organization.

    This API provides endpoints for processing user voice/text input and converting it into actionable items.
    The backend classifies inputs into categories (budget, shopping, reminders, calendar) and either handles
    them directly or returns actions for the iOS app to perform.

    ## Architecture
    - **Classification**: User input is analyzed using keyword matching and LLM-based classification
    - **Handler System**: Classified inputs are routed to appropriate handlers
    - **Action System**: Handlers return actions that are either backend-handled or require iOS app integration

    ## Authentication
    Currently no authentication is required (will be added in future versions).
  version: 0.1.0
  contact:
    name: Life Organizer API Support
  license:
    name: Proprietary

servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://api.life-organizer.example.com
    description: Production server (placeholder)

tags:
  - name: health
    description: Health check and status endpoints
  - name: classification
    description: User input classification and processing
  - name: budget
    description: Budget transaction management and export

paths:
  /:
    get:
      summary: Root endpoint
      description: Returns basic API information and links to documentation
      operationId: getRoot
      tags:
        - health
      responses:
        '200':
          description: API information
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - version
                  - api_version
                  - docs
                properties:
                  message:
                    type: string
                    example: Life Organizer Backend API
                  version:
                    type: string
                    example: 0.1.0
                  api_version:
                    type: string
                    example: v1
                  docs:
                    type: string
                    example: /api/v1/docs

  /health:
    get:
      summary: Health check endpoint
      description: Verify that the service is running and healthy
      operationId: healthCheck
      tags:
        - health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'

  /api/v1/health:
    get:
      summary: Versioned health check endpoint
      description: Verify that the service is running and healthy (versioned endpoint)
      operationId: healthCheckV1
      tags:
        - health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'

  /api/v1/status:
    get:
      summary: API status endpoint
      description: Returns API configuration and available endpoints
      operationId: getApiStatus
      tags:
        - health
      responses:
        '200':
          description: API status information
          content:
            application/json:
              schema:
                type: object
                required:
                  - api_version
                  - debug
                  - endpoints
                properties:
                  api_version:
                    type: string
                    example: v1
                  debug:
                    type: boolean
                    example: true
                  endpoints:
                    type: object
                    properties:
                      health:
                        type: string
                        example: /api/v1/health
                      docs:
                        type: string
                        example: /api/v1/docs

  /api/v1/process:
    post:
      summary: Process user input (supports multi-transaction)
      description: |
        Classify user voice or text input and execute the appropriate handler.

        **Supports multiple transactions in a single request** (up to 15 transactions).

        This endpoint:
        1. Validates the input
        2. Classifies it into categories (budget, shopping, reminder, calendar)
        3. Extracts multiple transactions if present
        4. Executes the appropriate handler for each transaction
        5. Returns an array of ProcessingResponse (one per transaction)

        ## Multi-Transaction Support
        - Single input: `"spent 50 at DM"` → Returns 1 response
        - Multiple: `"yesterday I spent 50 at DM and 120 at Next, today 5 at bakery"` → Returns 3 responses
        - Maximum: 15 transactions per request
        - Partial success: Some transactions may succeed while others fail

        ## Example Flows

        ### Single Budget Entry
        Request: `"spent 120eur at next"`
        Response: Array with 1 backend_handled response

        ### Multiple Budget Entries
        Request: `"I spent 50 at DM, 120 at Next, and 5 at the bakery"`
        Response: Array with 3 backend_handled responses
      operationId: processInput
      tags:
        - classification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyRequest'
            examples:
              single_transaction:
                summary: Single budget expense
                value:
                  input: "spent 120eur at next"
              multi_transaction:
                summary: Multiple transactions
                value:
                  input: "yesterday i spent 50 at dm and 5 at the bakery, today 120 at next"
              shared_context:
                summary: Shared date context
                value:
                  input: "yesterday I spent 50 at DM and 120 at Next"
      responses:
        '200':
          description: Successfully processed input (always returns array, even for single transaction)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessingResponse'
              examples:
                single_transaction:
                  summary: Single transaction (backend handled)
                  value:
                    - success: true
                      action_type: backend_handled
                      message: "Logged expenses: 234.6 BGN in Clothes"
                      app_action: null
                multi_transaction:
                  summary: Multiple transactions (all successful)
                  value:
                    - success: true
                      action_type: backend_handled
                      message: "Logged expenses: 98.0 BGN in Body care"
                      app_action: null
                    - success: true
                      action_type: backend_handled
                      message: "Logged expenses: 9.8 BGN in Eat out"
                      app_action: null
                    - success: true
                      action_type: backend_handled
                      message: "Logged expenses: 234.6 BGN in Clothes"
                      app_action: null
                partial_failure:
                  summary: Partial success (some transactions failed)
                  value:
                    - success: true
                      action_type: backend_handled
                      message: "Logged expenses: 98.0 BGN in Groceries"
                      app_action: null
                    - success: false
                      action_type: backend_handled
                      message: "Failed to save budget transaction to database"
                      app_action: null
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                empty_input:
                  summary: Empty input
                  value:
                    detail: "Input cannot be empty or whitespace only"
                too_many_transactions:
                  summary: Exceeds transaction limit
                  value:
                    detail: "Too many transactions detected (16). Maximum allowed: 15"
                validation_error:
                  summary: Budget entry validation error
                  value:
                    detail: "Could not process budget entry: Missing required fields: transaction_type"
        '501':
          description: Category not yet supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unsupported_category:
                  summary: Unsupported category
                  value:
                    detail: "Category 'shopping' is not yet supported"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                processing_error:
                  summary: Processing error
                  value:
                    detail: "Processing error: Unexpected classification failure"

  /api/v1/budget/export:
    get:
      summary: Export budget transactions as TSV
      description: |
        Export budget transactions in tab-separated values (TSV) format for easy copy/paste into Excel.

        Returns transactions filtered by start date (inclusive) in the following format:
        - Columns: Date, Type, Category, Amount, Details
        - Amount: Integer values in BGN (rounded up)
        - Sorted by date ascending (oldest first)
        - Empty string for null details

        The TSV format can be copied directly from the response and pasted into Excel,
        which will automatically parse the columns correctly.

        ## Example Usage
        1. Call the endpoint with desired start date
        2. Copy the entire response text
        3. Paste into Excel (columns will auto-separate)
      operationId: exportBudget
      tags:
        - budget
      parameters:
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Starting date for export (inclusive). Format YYYY-MM-DD
          example: "2025-11-01"
      responses:
        '200':
          description: Successfully exported budget transactions
          content:
            text/tab-separated-values:
              schema:
                type: string
                description: Tab-separated values (data rows only, no header)
              example: |
                2025-11-01	Expenses	Groceries	98	Kaufland
                2025-11-05	Income	Salary Ivo	3000	November salary
                2025-11-13	Savings	Avi Savings	1220	Monthly contribution
        '422':
          description: Validation error (invalid date format)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                database_error:
                  summary: Database connection error
                  value:
                    detail: "Failed to connect to database"

components:
  schemas:
    # Referenced from models.yaml (single source of truth for data models)
    ClassifyRequest:
      $ref: './models.yaml#/components/schemas/ClassifyRequest'

    ProcessingResponse:
      $ref: './models.yaml#/components/schemas/ProcessingResponse'

    # API-specific schemas (not part of data models)
    HealthCheckResponse:
      type: object
      required:
        - status
        - service
        - version
      properties:
        status:
          type: string
          example: healthy
        service:
          type: string
          example: life-organizer-backend
        version:
          type: string
          example: 0.1.0

    # Classification Schema (Internal, not exposed in public API)
    ClassifiedInput:
      type: object
      required:
        - category
        - confidence
        - extracted_data
        - raw_input
        - classifier_source
      properties:
        category:
          $ref: './models.yaml#/components/schemas/Category'
        confidence:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: Confidence score (0.0-1.0)
        extracted_data:
          type: object
          additionalProperties: true
          description: Extracted structured data (amounts, items, categories, etc.)
        raw_input:
          type: string
          description: Original raw input text
        classifier_source:
          type: string
          enum: [keyword, llm]
          description: Source classifier that produced this result
      description: |
        Result of classifying user input through the classification engine.
        This is an internal schema used between the classifier and handlers.

    # Error Schemas
    ValidationError:
      type: object
      required:
        - detail
      properties:
        detail:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
          description: Detailed validation error information
      description: Validation error response (422 Unprocessable Entity)

    ErrorResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
          description: Error message
          example: "Processing error: Unexpected classification failure"
      description: Generic error response

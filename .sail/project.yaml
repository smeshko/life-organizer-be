# life-organizer-be's sail config: the factory runs on tickets from Linear team LIFE labelled factory-be and opens its
# pull requests on GitHub, into staging. Set every port back to `fake` to run on the seeds under .sail/fake/ at no cost.
# LIFE is shared with the iOS and web repositories, so this repository's labels carry `be`.

# The repository's name, unique among this machine's watchers.
name: life-organizer-be
# The sail versions this .sail/ runs on.
sail: ">=0.0.0 <1"
# The label that designates a ticket for sail: the factory's tickets, and the pull requests review picks up.
label: factory-be
# The workflow `sail <ticket>` runs when --workflow is left out.
defaultWorkflow: factory

# Which adapter fills each port.
adapters:
  # Open moves the ticket to In Review once its pull request is up.
  ticketSource: { use: linear, team: LIFE, inReview: In Review }
  codeHost: { use: github }
  harness: { use: claude-code }
  # Each run's workspace is a fresh worktree off staging (GitHub's default branch here is main), and its setup builds
  # the .venv the gate runs in, before any stage runs.
  workspace: { use: git-worktree, defaultBranch: staging, setup: uv sync --all-extras }
  # Jev answers check-tasks before its agent runs, and file-follow-ups' duplicate check. Without TYPESAFE_API_KEY both
  # fall back: the agent checks every task, and follow-ups are filed unchecked.
  jev: { use: typesafe }

models:
  default: claude-sonnet-5-5
  deep: claude-opus-5-5
  fast: claude-haiku-5-5
# No dollar cap on the run: each agent stage carries its own. Minutes are wall time.
budgets: { run: { maxMinutes: 240 } }
# The conventions appended to every prompt: .sail/conventions.md until the root AGENTS.md exists.
conventions: [.sail/conventions.md]
